# Local development services only. Passwords here are dev-only throwaways.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tp
      POSTGRES_PASSWORD: tp_dev_password
      POSTGRES_DB: tp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp -d tp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: